name: Promote to production

# Manual gate: migrate the production database, then flip production
# traffic to an already-built staging deployment without rebuilding.
# See ADR-0001 for the reasoning.
on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Staging deployment URL to promote (the master/staging deployment you've verified)"
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - name: Pull Production environment variables
        run: npx vercel env pull .env.production.local --environment=production --token=${{ secrets.VERCEL_TOKEN }} --yes

      - name: Run migrations against the production database
        run: |
          set -a
          source .env.production.local
          set +a
          npm run migrate:up

      - name: Promote staging deployment to production
        run: npx vercel promote "${{ inputs.deployment_url }}" --token=${{ secrets.VERCEL_TOKEN }} --yes
